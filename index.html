<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0E17" />
    <meta name="description" content="A practice IDE for Cambridge O Level Computer Science (2210) pseudocode, with a togglable Learning mode and Test mode." />
    <title>PseudoIDE — CAIE O Level Pseudocode Practice</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cs-pseudo-theme');
          var theme = stored ? JSON.parse(stored).state.theme : 'system';
          var isLight =
            theme === 'light' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (isLight) document.documentElement.classList.add('light');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
